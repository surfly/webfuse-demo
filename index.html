<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Webfuse live demo</title>
<script>
/* The start page moved to https://demo.webfuse.it/. This page only forwards
 * links sent before the move: ?c=<link id> goes to /<link id>, ?t=<token> to
 * /?t=<token>. */
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('c');
  var token = params.get('t');
  var url = 'https://demo.webfuse.it/';
  if (code && /^[A-Za-z0-9_-]{12}$/.test(code)) {
    url += code;
  } else if (token) {
    url += '?t=' + encodeURIComponent(token.trim());
  }
  window.location.replace(url);
}());
</script>
</head>
<body>
<p>The Webfuse demo has moved to <a href="https://demo.webfuse.it/">demo.webfuse.it</a>.</p>
</body>
</html>
